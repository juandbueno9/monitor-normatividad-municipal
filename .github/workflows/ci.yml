name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Python · lint y sintaxis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (errores de sintaxis y nombres indefinidos)
        run: pipx run ruff check --select E9,F63,F7,F82 --output-format github .
      - name: Compilación
        run: python -m compileall -q .
      - name: ShellCheck
        run: |
          files=$(find . -name '*.sh')
          if [ -n "$files" ]; then shellcheck -S error $files; else echo "Sin scripts bash"; fi
